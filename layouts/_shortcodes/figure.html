<figure class="my-4 w-fit">
    {{- $u := urls.Parse (.Get "src") -}}
    {{- $src := $u.String -}}
    {{- if not $u.IsAbs -}}
    {{- with or (.Page.Resources.Get $u.Path) (resources.Get $u.Path) -}}
    {{- $src = .RelPermalink -}}
    {{- end -}}
    {{- end -}}
    <img src="{{ $src }}" alt="{{ .Get " alt" }}" class="js-preview-image">
    {{- with .Get "caption" -}}
    <figcaption class="text-[0.85em] text-center">{{ . }}</figcaption>
    {{- end -}}
</figure>
